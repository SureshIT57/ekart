name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build shop
        working-directory: client
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://ekart-api.onrender.com/api' }}
        run: |
          npm ci
          npx vite build --base /ekart/
          cp dist/index.html dist/404.html
      - name: Build admin
        working-directory: admin
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://ekart-api.onrender.com/api' }}
        run: |
          npm ci
          npx vite build --base /ekart/admin/
          cp dist/index.html dist/404.html
          mkdir -p ../client/dist/admin
          cp -r dist/. ../client/dist/admin/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
